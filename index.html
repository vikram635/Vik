<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIK4NT.INC Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg-gradient: radial-gradient(circle at 10% 10%, #3b0764 0%, #0f172a 40%), radial-gradient(circle at 90% 90%, #1e1b4b 0%, #0284c7 100%);
  --card-bg: rgba(30, 41, 59, 0.85);
  --border: rgba(255, 255, 255, 0.15);
  --purple-glow: #8b5cf6;
}
body{ font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: #fff; min-height: 100vh; padding: 15px; }
.container{ width: 100%; max-width: 950px; margin: auto; }
.card{ background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 20px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.5); margin-bottom: 20px; }
.auth-card{ max-width: 420px; margin: 40px auto; }

.brand-title{ text-align: center; color: #a78bfa; font-size: 28px; font-weight: 800; }
.brand-subtitle{ text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

.tabs{ display: flex; gap: 10px; margin-bottom: 20px; }
.tabs button{ flex: 1; padding: 12px; border: none; border-radius: 12px; background: rgba(255,255,255,0.08); color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; }
.tabs button.active{ background: linear-gradient(135deg, #7c3aed, #2563eb); box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }

input, textarea{ width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 14px; outline: none; }
input:focus, textarea:focus{ border-color: var(--purple-glow); }

button.btn-main{ width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
button.btn-main:hover{ opacity: 0.9; }

.header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }
.nav-btns{ display: flex; gap: 8px; flex-wrap: wrap; }
.nav-btn{ background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
.nav-btn.active{ background: var(--purple-glow); border-color: var(--purple-glow); }

.stats-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
.stat-box{ background: rgba(15, 23, 42, 0.7); padding: 18px; border-radius: 14px; border: 1px solid var(--border); }
.stat-box small{ color: #94a3b8; font-size: 11px; text-transform: uppercase; font-weight: 600; }
.stat-box strong{ display: block; font-size: 22px; margin-top: 6px; color: #fff; }

.btn-att{ padding: 16px; width: 100%; margin: 8px 0; font-size: 17px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; color: #fff; }
.checkin{ background: linear-gradient(135deg, #059669, #10b981); }
.checkout{ background: linear-gradient(135deg, #ea580c, #f97316); }

table{ width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
th, td{ padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
th{ color: #a78bfa; }

.badge{ display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
.badge-green{ background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
.badge-blue{ background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(37,99,235,0.3); }

.video-card{ background: rgba(15, 23, 42, 0.9); border-radius: 14px; border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; }
.video-card iframe{ width: 100%; height: 210px; border-radius: 10px; border: none; }

.msg{ margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; font-weight: bold; word-break: break-all; }
.err{ background: rgba(239,68,68,0.3); color: #fca5a5; border: 1px solid #ef4444; }
.succ{ background: rgba(16,185,129,0.3); color: #86efac; border: 1px solid #10b981; }
.hidden{ display: none !important; }
</style>
</head>
<body>

<div class="container">

  <!-- AUTH PAGE -->
  <div id="authPage" class="card auth-card">
    <div class="brand-title">👑 VIK4NT.INC</div>
    <div class="brand-subtitle">Attendance & Learning Portal</div>

    <div class="tabs">
      <button id="tLogin" class="active" onclick="setAuth('login')">Login</button>
      <button id="tSignup" onclick="setAuth('signup')">Sign Up</button>
    </div>

    <div id="sFields" class="hidden">
      <input id="fName" type="text" placeholder="Full Name">
      <input id="fPhone" type="tel" placeholder="Phone Number">
    </div>
    <input id="fEmail" type="email" placeholder="Email Address">
    <input id="fPass" type="password" placeholder="Password">

    <button id="fBtn" class="btn-main" onclick="submitAuth()">Login</button>
    <div id="fMsg" class="msg hidden"></div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashPage" class="card hidden">
    <div class="header">
      <div>
        <h3 id="wMsg" style="font-size:20px;">👋 Welcome</h3>
        <small id="uBadge" class="badge badge-blue">USER</small>
      </div>
      <button onclick="logout()" style="background:#dc2626; color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold;">Logout</button>
    </div>

    <div class="nav-btns">
      <button id="nbDash" class="nav-btn active" onclick="showTab('dash')">🏠 Attendance</button>
      <button id="nbLearn" class="nav-btn" onclick="showTab('learn')">📚 Learning</button>
      <button id="nbProf" class="nav-btn" onclick="showTab('prof')">👤 Profile</button>
    </div>

    <!-- TAB 1: ATTENDANCE -->
    <div id="tabDash">
      <div class="stats-grid">
        <div class="stat-box"><small>Today Status</small><strong id="uStatus">Not Marked</strong></div>
        <div class="stat-box"><small>Check In</small><strong id="uCheckIn">--</strong></div>
        <div class="stat-box"><small>Check Out</small><strong id="uCheckOut">--</strong></div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-att checkin" onclick="doAtt('CHECKED_IN')">🟢 Check In</button>
        <button class="btn-att checkout" onclick="doAtt('COMPLETED')">🔴 Check Out</button>
      </div>

      <h4 style="margin-top:20px; color:#a78bfa;">📋 Attendance History</h4>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
          <tbody id="attRows"><tr><td colspan="4" style="text-align:center;">No records</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: LEARNING -->
    <div id="tabLearn" class="hidden">
      <h4 style="color:#a78bfa; margin-bottom:15px;">📚 Training Videos</h4>
      <div id="adminVideoBox" class="hidden" style="background:rgba(15,23,42,0.9); padding:15px; border-radius:12px; border:1px solid var(--border); margin-bottom:20px;">
        <h5 style="color:#38bdf8; margin-bottom:8px;">➕ Add Video (Admin Only)</h5>
        <input id="vTitle" type="text" placeholder="Video Title">
        <input id="vUrl" type="text" placeholder="YouTube Link (e.g. https://youtu.be/...)">
        <button class="btn-main" onclick="addVideo()">Save Video</button>
      </div>
      <div id="vList">Loading videos...</div>
    </div>

    <!-- TAB 3: PROFILE -->
    <div id="tabProf" class="hidden">
      <h4 style="color:#a78bfa; margin-bottom:15px;">👤 My Profile</h4>
      <div style="max-width:400px;">
        <input id="pName" type="text" placeholder="Full Name">
        <input id="pEmail" type="email" readonly style="opacity:0.6;">
        <input id="pPhone" type="tel" placeholder="Phone Number">
        <input id="pPass" type="password" placeholder="New Password (optional)">
        <button class="btn-main" onclick="updateProfile()">Save Changes</button>
      </div>
      <div id="pMsg" class="msg hidden"></div>
    </div>

    <div id="dMsg" class="msg hidden"></div>
  </div>

</div>

<script>
const S_URL = "https://jdetqupmtgrrwzrufhsg.supabase.co";
const S_KEY = "sb_publishable_QVtX3-gxQnXhsZC5tIwV8w_XXOGmmNI";
let db = null;
let mode = "login";
let user = null;

window.onload = function() {
  try {
    if(typeof supabase !== 'undefined') {
      db = supabase.createClient(S_URL, S_KEY);
      const saved = localStorage.getItem("v_user");
      if(saved) {
        user = JSON.parse(saved);
        openDash();
      }
    }
  } catch(e) { console.error(e); }
};

function setAuth(m) {
  mode = m;
  hideBox("fMsg");
  if(m === 'signup') {
    document.getElementById("tSignup").className = "active";
    document.getElementById("tLogin").className = "";
    document.getElementById("sFields").className = "";
    document.getElementById("fBtn").textContent = "Create Account";
  } else {
    document.getElementById("tLogin").className = "active";
    document.getElementById("tSignup").className = "";
    document.getElementById("sFields").className = "hidden";
    document.getElementById("fBtn").textContent = "Login";
  }
}

function showBox(id, txt, err) {
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = txt;
  el.className = "msg " + (err ? "err" : "succ");
  el.classList.remove("hidden");
}

function hideBox(id) { 
  const el = document.getElementById(id);
  if(el) el.classList.add("hidden"); 
}

async function submitAuth() {
  const email = document.getElementById("fEmail").value.trim();
  const pass = document.getElementById("fPass").value;

  if(!email || !pass) {
    showBox("fMsg", "⚠️ Email aur Password bharein!", true);
    return;
  }

  const btn = document.getElementById("fBtn");
  btn.disabled = true;
  btn.textContent = "Connecting...";
  showBox("fMsg", "Connecting to database...", false);

  try {
    if(mode === 'signup') {
      const name = document.getElementById("fName").value.trim();
      const phone = document.getElementById("fPhone").value.trim();
      if(!name) { showBox("fMsg", "⚠️ Naam bharein!", true); btn.disabled = false; btn.textContent = "Create Account"; return; }

      const { data, error } = await db.from('users').insert([{
        full_name: name, email: email, phone: phone, password: pass, role: 'USER'
      }]).select();

      btn.disabled = false;
      btn.textContent = "Create Account";

      if(error) {
        showBox("fMsg", "❌ Signup Error: " + error.message, true);
      } else {
        showBox("fMsg", "✅ Account बन गया!", false);
        user = data[0];
        localStorage.setItem("v_user", JSON.stringify(user));
        setTimeout(openDash, 500);
      }
    } else {
      const { data, error } = await db.from('users').select('*').eq('email', email).eq('password', pass);

      btn.disabled = false;
      btn.textContent = "Login";

      if(error) {
        showBox("fMsg", "❌ Login Error: " + error.message, true);
      } else if(!data || data.length === 0) {
        showBox("fMsg", "❌ Galat Email ya Password!", true);
      } else {
        showBox("fMsg", "✅ Login Successful!", false);
        user = data[0];
        localStorage.setItem("v_user", JSON.stringify(user));
        setTimeout(openDash, 300);
      }
    }
  } catch(err) {
    btn.disabled = false;
    btn.textContent = "Login";
    showBox("fMsg", "Error: " + err.message, true);
  }
}

function openDash() {
  document.getElementById("authPage").className = "card auth-card hidden";
  document.getElementById("dashPage").className = "card";
  document.getElementById("wMsg").textContent = "👋 Welcome, " + (user.full_name || "User");
  document.getElementById("uBadge").textContent = user.role || "USER";

  if(user.role === 'ADMIN') {
    document.getElementById("adminVideoBox").classList.remove("hidden");
  }

  showTab('dash');
}

function showTab(t) {
  document.getElementById("tabDash").classList.add("hidden");
  document.getElementById("tabLearn").classList.add("hidden");
  document.getElementById("tabProf").classList.add("hidden");

  document.getElementById("nbDash").className = "nav-btn";
  document.getElementById("nbLearn").className = "nav-btn";
  document.getElementById("nbProf").className = "nav-btn";

  if(t === 'dash') {
    document.getElementById("tabDash").classList.remove("hidden");
    document.getElementById("nbDash").className = "nav-btn active";
    loadAtt();
  } else if(t === 'learn') {
    document.getElementById("tabLearn").classList.remove("hidden");
    document.getElementById("nbLearn").className = "nav-btn active";
    loadVideos();
  } else if(t === 'prof') {
    document.getElementById("tabProf").classList.remove("hidden");
    document.getElementById("nbProf").className = "nav-btn active";
    loadProfile();
  }
}

async function doAtt(st) {
  showBox("dMsg", "Saving...", false);
  const today = new Date().toISOString().slice(0,10);
  const time = new Date().toLocaleTimeString();

  const { error } = await db.from('attendance').insert([{
    user_id: user.user_id,
    user_name: user.full_name,
    date: today,
    check_in: st === 'CHECKED_IN' ? time : null,
    check_out: st === 'COMPLETED' ? time : null,
    status: st
  }]);

  if(error) {
    showBox("dMsg", "Error: " + error.message, true);
  } else {
    showBox("dMsg", "✅ Attendance Saved (" + st + ")", false);
    loadAtt();
  }
}

async function loadAtt() {
  const today = new Date().toISOString().slice(0,10);
  const { data } = await db.from('attendance').select('*').eq('user_id', user.user_id).order('created_at', { ascending: false });
  const tbody = document.getElementById("attRows");
  if(!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records</td></tr>';
    return;
  }

  let todayRec = data.find(r => r.date === today);
  if (todayRec) {
    document.getElementById("uStatus").textContent = todayRec.status;
    document.getElementById("uCheckIn").textContent = todayRec.check_in || "--";
    document.getElementById("uCheckOut").textContent = todayRec.check_out || "--";
  }

  let html = "";
  data.forEach(r => {
    html += `<tr><td>${r.date}</td><td>${r.check_in||'--'}</td><td>${r.check_out||'--'}</td><td><span class="badge ${r.status==='COMPLETED'?'badge-green':'badge-blue'}">${r.status}</span></td></tr>`;
  });
  tbody.innerHTML = html;
}

async function addVideo() {
  const t = document.getElementById("vTitle").value.trim();
  let u = document.getElementById("vUrl").value.trim();
  if(!t || !u) return alert("Title aur URL dono zaroori hain!");

  if(u.includes("watch?v=")) u = "https://www.youtube.com/embed/" + u.split("watch?v=")[1].split("&")[0];
  if(u.includes("youtu.be/")) u = "https://www.youtube.com/embed/" + u.split("youtu.be/")[1].split("?")[0];

  const { error } = await db.from('videos').insert([{ title: t, video_url: u }]);
  if(error) alert("Error: " + error.message);
  else {
    alert("✅ Video Saved!");
    document.getElementById("vTitle").value = "";
    document.getElementById("vUrl").value = "";
    loadVideos();
  }
}

async function loadVideos() {
  const { data } = await db.from('videos').select('*').order('created_at', { ascending: false });
  const box = document.getElementById("vList");
  if(!data || data.length === 0) {
    box.innerHTML = "<p style='color:#aaa;'>No videos available.</p>";
    return;
  }
  let html = "";
  data.forEach(v => {
    html += `<div class="video-card">
      <iframe src="${v.video_url}" allowfullscreen></iframe>
      <h5 style="margin-top:10px; color:#38bdf8; font-size:16px;">${v.title}</h5>
    </div>`;
  });
  box.innerHTML = html;
}

function loadProfile() {
  document.getElementById("pName").value = user.full_name || "";
  document.getElementById("pEmail").value = user.email || "";
  document.getElementById("pPhone").value = user.phone || "";
}

async function updateProfile() {
  const name = document.getElementById("pName").value.trim();
  const phone = document.getElementById("pPhone").value.trim();
  const pass = document.getElementById("pPass").value;

  let updatePayload = { full_name: name, phone: phone };
  if(pass) updatePayload.password = pass;

  try {
    const { data, error } = await db.from('users')
      .update(updatePayload)
      .eq('user_id', user.user_id)
      .select().single();

    if(error) {
      showBox("pMsg", "Error: " + error.message, true);
    } else {
      user = data;
      localStorage.setItem("v_user", JSON.stringify(user));
      showBox("pMsg", "✅ Profile updated!", false);
    }
  } catch(e) { showBox("pMsg", "Error: " + e.message, true); }
}

function logout() {
  localStorage.removeItem("v_user");
  location.reload();
}
</script>
</body>
</html>
