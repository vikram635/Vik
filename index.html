<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIK4NT.INC Attendance System</title>
<!-- Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:Arial, sans-serif; background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.card{ background:#1e293b; border-radius:16px; padding:30px; width:100%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.5); border:1px solid #334155; }
h2{ text-align:center; margin-bottom:20px; color:#38bdf8; font-size:24px; }
.tabs{ display:flex; gap:10px; margin-bottom:20px; }
.tabs button{ flex:1; padding:10px; border:none; border-radius:8px; background:#334155; color:#fff; font-weight:bold; cursor:pointer; }
.tabs button.active{ background:#0284c7; }
input{ width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:15px; outline:none; }
button.submit{ width:100%; padding:12px; margin-top:12px; border:none; border-radius:8px; background:#0284c7; color:#fff; font-weight:bold; font-size:16px; cursor:pointer; }
button.submit:disabled{ background:#475569; cursor:not-allowed; }
.msg{ margin-top:15px; padding:10px; border-radius:8px; font-size:14px; text-align:center; word-break:break-word; }
.msg.err{ background:#7f1d1d; color:#fca5a5; }
.msg.succ{ background:#14532d; color:#86efac; }
.hidden{ display:none; }
</style>
</head>
<body>

<div class="card">
  <h2>VIK4NT.INC</h2>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setMode('login')">Login</button>
    <button id="tabSignup" onclick="setMode('signup')">Sign Up</button>
  </div>

  <form id="authForm" onsubmit="handleAuth(event)">
    <div id="nameBox" class="hidden">
      <input id="fullName" type="text" placeholder="Full Name">
      <input id="phone" type="tel" placeholder="Phone Number">
    </div>
    <input id="email" type="email" placeholder="Email Address" required>
    <input id="password" type="password" placeholder="Password (min 6 chars)" required minlength="6">
    <button id="btnSubmit" type="submit" class="submit">Login</button>
  </form>

  <div id="msgBox" class="msg hidden"></div>
</div>

<script>
const SUPABASE_URL = "https://jdetqupmtgrrwzrufhsg.supabase.co";
const SUPABASE_KEY = "sb_publishable_QVtX3-gxQnXhsZC5tIwV8w_XXOGmmNI";
let db = null;
let mode = "login";

window.onload = function() {
  try {
    if (typeof supabase !== 'undefined') {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } else {
      showMsg("⚠️ Supabase SDK Library missing. Check internet connection.", true);
    }
  } catch(e) {
    showMsg("⚠️ Init Error: " + e.message, true);
  }
};

function setMode(m) {
  mode = m;
  hideMsg();
  if (m === 'signup') {
    document.getElementById("tabSignup").classList.add("active");
    document.getElementById("tabLogin").classList.remove("active");
    document.getElementById("nameBox").classList.remove("hidden");
    document.getElementById("fullName").required = true;
    document.getElementById("btnSubmit").textContent = "Create Account";
  } else {
    document.getElementById("tabLogin").classList.add("active");
    document.getElementById("tabSignup").classList.remove("active");
    document.getElementById("nameBox").classList.add("hidden");
    document.getElementById("fullName").required = false;
    document.getElementById("btnSubmit").textContent = "Login";
  }
}

function showMsg(text, isError) {
  const b = document.getElementById("msgBox");
  b.textContent = text;
  b.className = "msg " + (isError ? "err" : "succ");
  b.classList.remove("hidden");
}

function hideMsg() {
  document.getElementById("msgBox").classList.add("hidden");
}

async function handleAuth(e) {
  e.preventDefault();
  if (!db) {
    showMsg("⚠️ DB connection not active. Page refresh karein.", true);
    return;
  }

  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  btn.textContent = "Processing...";
  hideMsg();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    if (mode === 'signup') {
      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();

      // Check if email exists
      const { data: exist, error: checkErr } = await db.from('users').select('email').eq('email', email);
      if (checkErr) throw checkErr;

      if (exist && exist.length > 0) {
        showMsg("❌ Ye Email pehle se registered hai!", true);
        btn.disabled = false;
        btn.textContent = "Create Account";
        return;
      }

      // Check user count for role
      const { count, error: countErr } = await db.from('users').select('*', { count: 'exact', head: true });
      if (countErr) throw countErr;

      const role = (count === 0) ? 'ADMIN' : 'USER';

      // Insert User
      const { error: insErr } = await db.from('users').insert([{
        full_name: fullName,
        email: email,
        phone: phone,
        password: password,
        role: role
      }]);

      if (insErr) throw insErr;

      showMsg("✅ Account ban gaya! Login pe switch ho raha hai...", false);
      setTimeout(() => { 
        document.getElementById("authForm").reset();
        setMode('login'); 
        btn.disabled = false; 
      }, 1500);

    } else {
      // Login
      const { data, error } = await db.from('users')
        .select('*')
        .eq('email', email)
        .eq('password', password)
        .maybeSingle();

      if (error) throw error;
      if (!data) {
        showMsg("❌ Galat Email ya Password!", true);
        btn.disabled = false;
        btn.textContent = "Login";
        return;
      }

      if (data.status && data.status !== 'ACTIVE') {
        showMsg("❌ Aapka account blocked hai!", true);
        btn.disabled = false;
        btn.textContent = "Login";
        return;
      }

      showMsg("✅ Login Success! Welcome " + data.full_name, false);
      localStorage.setItem("attendance_user", JSON.stringify(data));
      btn.disabled = false;
      btn.textContent = "Login";
    }
  } catch(err) {
    showMsg("❌ DB Error: " + (err.message || JSON.stringify(err)), true);
    btn.disabled = false;
    btn.textContent = (mode === 'signup') ? "Create Account" : "Login";
  }
}
</script>
</body>
</html>
