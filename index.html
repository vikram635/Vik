<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under maintenance</title>
<style>
  :root{
    --bg:#eef2f5; --ink:#1c2733; --muted:#5b6b7a; --line:#c9d3dc; --accent:#2f6fa3; --fill:#dfe7ee;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#141b22;--ink:#e6edf3;--muted:#93a3b2;--line:#2b3946;--accent:#6aa9dc;--fill:#1d2832;}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
    line-height:1.6;
  }
  main{max-width:520px;width:100%}
  .gauge{width:100%;height:10px;background:var(--fill);border-radius:5px;overflow:hidden;margin:0 0 36px}
  .gauge span{display:block;height:100%;width:40%;background:var(--accent);border-radius:5px;
    animation:slide 2.4s ease-in-out infinite alternate}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(150%)}}
  @media (prefers-reduced-motion:reduce){.gauge span{animation:none;width:60%}}
  h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin:0 0 16px;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--muted);font-size:1.05rem;max-width:46ch}
  .box{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:.95rem;color:var(--muted)}
  a{color:var(--accent);font-weight:600}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="gauge" role="presentation"><span></span></div>
  <h1>We're making improvements</h1>
  <p>Our website is down for scheduled maintenance. Everything will be back shortly, and your data is safe.</p>
  <p>Expected back: <strong>11 October 2027, 9:30 AM</strong></p>
  <div class="box">
    Need help now? Email <a href="mailto:vikram.r@freefireind.info">vikram.r@freefireind.info</a>.
  </div>
</main>
</body>
</html>
