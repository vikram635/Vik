<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIK4NT.INC Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family: Arial, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; padding: 15px; }
.card{ background: #1e293b; border-radius: 20px; padding: 25px; border: 1px solid #334155; max-width: 420px; margin: 30px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.app-card{ max-width: 900px; }
h2{ text-align: center; color: #38bdf8; margin-bottom: 15px; }
.tabs{ display: flex; gap: 10px; margin-bottom: 15px; }
.tabs button{ flex: 1; padding: 12px; border: none; border-radius: 10px; background: #334155; color: #fff; font-weight: bold; cursor: pointer; }
.tabs button.active{ background: #0284c7; }
input, textarea{ width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
button.btn-main{ width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 10px; background: #0284c7; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
.msg{ margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; font-weight: bold; word-break: break-all; }
.err{ background: #7f1d1d; color: #fca5a5; }
.succ{ background: #14532d; color: #86efac; }
.hidden{ display: none !important; }
.header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
.btn-att{ padding: 15px; width: 100%; margin: 8px 0; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: #fff; }
.checkin{ background: #10b981; }
.checkout{ background: #f97316; }
table{ width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
th, td{ padding: 10px; border-bottom: 1px solid #334155; }
th{ color: #94a3b8; }
.nav-btns{ display: flex; gap: 8px; margin-bottom: 15px; }
.nav-btn{ background: #334155; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
.nav-btn.active{ background: #0284c7; }
</style>
</head>
<body>

<!-- AUTH PAGE -->
<div id="authPage" class="card">
  <h2>👑 VIK4NT.INC</h2>
  <div class="tabs">
    <button id="tLogin" class="active" onclick="setAuth('login')">Login</button>
    <button id="tSignup" onclick="setAuth('signup')">Sign Up</button>
  </div>

  <div id="sFields" class="hidden">
    <input id="fName" type="text" placeholder="Full Name">
    <input id="fPhone" type="tel" placeholder="Phone Number">
  </div>
  <input id="fEmail" type="email" placeholder="Email Address">
  <input id="fPass" type="password" placeholder="Password">

  <button id="fBtn" class="btn-main" onclick="submitAuth()">Login</button>
  <div id="fMsg" class="msg hidden"></div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashPage" class="card app-card hidden">
  <div class="header">
    <h3 id="wMsg">👋 Welcome</h3>
    <button onclick="logout()" style="background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">Logout</button>
  </div>

  <div class="nav-btns">
    <button id="nbDash" class="nav-btn active" onclick="showTab('dash')">🏠 Attendance</button>
    <button id="nbLearn" class="nav-btn" onclick="showTab('learn')">📚 Learning</button>
  </div>

  <!-- TAB 1: ATTENDANCE -->
  <div id="tabDash">
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-att checkin" onclick="doAtt('CHECKED_IN')">🟢 Check In</button>
      <button class="btn-att checkout" onclick="doAtt('COMPLETED')">🔴 Check Out</button>
    </div>

    <h4 style="margin-top:20px; color:#38bdf8;">📋 Attendance History</h4>
    <table>
      <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
      <tbody id="attRows"><tr><td colspan="4" style="text-align:center;">No records</td></tr></tbody>
    </table>
  </div>

  <!-- TAB 2: LEARNING -->
  <div id="tabLearn" class="hidden">
    <h4 style="color:#38bdf8; margin-bottom:10px;">📚 Training Videos</h4>
    <div id="adminVideoBox" class="hidden" style="background:#0f172a; padding:15px; border-radius:10px; margin-bottom:15px;">
      <h5>➕ Add Video (Admin Only)</h5>
      <input id="vTitle" type="text" placeholder="Video Title">
      <input id="vUrl" type="text" placeholder="YouTube Link (e.g. https://youtu.be/...)">
      <button class="btn-main" onclick="addVideo()">Save Video</button>
    </div>
    <div id="vList">Loading videos...</div>
  </div>

  <div id="dMsg" class="msg hidden"></div>
</div>

<script>
const S_URL = "https://jdetqupmtgrrwzrufhsg.supabase.co";
const S_KEY = "sb_publishable_QVtX3-gxQnXhsZC5tIwV8w_XXOGmmNI";
let db = null;
let mode = "login";
let user = null;

window.onload = function() {
  try {
    if(typeof supabase !== 'undefined') {
      db = supabase.createClient(S_URL, S_KEY);
      const saved = localStorage.getItem("v_user");
      if(saved) {
        user = JSON.parse(saved);
        openDash();
      }
    } else {
      showBox("fMsg", "Supabase library connection fail!", true);
    }
  } catch(e) { showBox("fMsg", "Error: " + e.message, true); }
};

function setAuth(m) {
  mode = m;
  hideBox("fMsg");
  if(m === 'signup') {
    document.getElementById("tSignup").className = "active";
    document.getElementById("tLogin").className = "";
    document.getElementById("sFields").className = "";
    document.getElementById("fBtn").textContent = "Create Account";
  } else {
    document.getElementById("tLogin").className = "active";
    document.getElementById("tSignup").className = "";
    document.getElementById("sFields").className = "hidden";
    document.getElementById("fBtn").textContent = "Login";
  }
}

function showBox(id, txt, err) {
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = txt;
  el.className = "msg " + (err ? "err" : "succ");
  el.classList.remove("hidden");
}

function hideBox(id) { 
  const el = document.getElementById(id);
  if(el) el.classList.add("hidden"); 
}

async function submitAuth() {
  const email = document.getElementById("fEmail").value.trim();
  const pass = document.getElementById("fPass").value;

  if(!email || !pass) {
    showBox("fMsg", "Email aur Password bharein!", true);
    return;
  }

  const btn = document.getElementById("fBtn");
  btn.disabled = true;
  btn.textContent = "Connecting...";
  showBox("fMsg", "Database se connect ho raha hai...", false);

  try {
    if(mode === 'signup') {
      const name = document.getElementById("fName").value.trim();
      const phone = document.getElementById("fPhone").value.trim();
      if(!name) { showBox("fMsg", "Naam bharein!", true); btn.disabled = false; btn.textContent = "Create Account"; return; }

      const { data, error } = await db.from('users').insert([{
        full_name: name, email: email, phone: phone, password: pass, role: 'USER'
      }]).select();

      btn.disabled = false;
      btn.textContent = "Create Account";

      if(error) {
        showBox("fMsg", "Signup Fail: " + error.message, true);
      } else {
        showBox("fMsg", "✅ Account ban gaya!", false);
        user = data[0];
        localStorage.setItem("v_user", JSON.stringify(user));
        setTimeout(openDash, 500);
      }
    } else {
      const { data, error } = await db.from('users').select('*').eq('email', email).eq('password', pass);

      btn.disabled = false;
      btn.textContent = "Login";

      if(error) {
        showBox("fMsg", "Login Error: " + error.message, true);
      } else if(!data || data.length === 0) {
        showBox("fMsg", "❌ Galat Email ya Password!", true);
      } else {
        showBox("fMsg", "✅ Login Ho Gaya!", false);
        user = data[0];
        localStorage.setItem("v_user", JSON.stringify(user));
        setTimeout(openDash, 300);
      }
    }
  } catch(err) {
    btn.disabled = false;
    btn.textContent = "Login";
    showBox("fMsg", "Error: " + err.message, true);
  }
}

function openDash() {
  document.getElementById("authPage").className = "card hidden";
  document.getElementById("dashPage").className = "card app-card";
  document.getElementById("wMsg").textContent = "👋 Welcome, " + (user.full_name || "User");

  if(user.role === 'ADMIN') {
    document.getElementById("adminVideoBox").classList.remove("hidden");
  }

  showTab('dash');
}

function showTab(t) {
  if(t === 'dash') {
    document.getElementById("tabDash").classList.remove("hidden");
    document.getElementById("tabLearn").classList.add("hidden");
    document.getElementById("nbDash").className = "nav-btn active";
    document.getElementById("nbLearn").className = "nav-btn";
    loadAtt();
  } else {
    document.getElementById("tabDash").classList.add("hidden");
    document.getElementById("tabLearn").classList.remove("hidden");
    document.getElementById("nbDash").className = "nav-btn";
    document.getElementById("nbLearn").className = "nav-btn active";
    loadVideos();
  }
}

async function doAtt(st) {
  showBox("dMsg", "Saving...", false);
  const today = new Date().toISOString().slice(0,10);
  const time = new Date().toLocaleTimeString();

  const { error } = await db.from('attendance').insert([{
    user_id: user.user_id,
    user_name: user.full_name,
    date: today,
    check_in: st === 'CHECKED_IN' ? time : null,
    check_out: st === 'COMPLETED' ? time : null,
    status: st
  }]);

  if(error) {
    showBox("dMsg", "Error: " + error.message, true);
  } else {
    showBox("dMsg", "✅ Attendance Saved (" + st + ")", false);
    loadAtt();
  }
}

async function loadAtt() {
  const { data } = await db.from('attendance').select('*').eq('user_id', user.user_id).order('created_at', { ascending: false });
  const tbody = document.getElementById("attRows");
  if(!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records</td></tr>';
    return;
  }
  let html = "";
  data.forEach(r => {
    html += `<tr><td>${r.date}</td><td>${r.check_in||'--'}</td><td>${r.check_out||'--'}</td><td><b>${r.status}</b></td></tr>`;
  });
  tbody.innerHTML = html;
}

async function addVideo() {
  const t = document.getElementById("vTitle").value.trim();
  let u = document.getElementById("vUrl").value.trim();
  if(!t || !u) return alert("Title aur URL dono zaroori hain!");

  if(u.includes("watch?v=")) u = "https://www.youtube.com/embed/" + u.split("watch?v=")[1].split("&")[0];
  if(u.includes("youtu.be/")) u = "https://www.youtube.com/embed/" + u.split("youtu.be/")[1].split("?")[0];

  const { error } = await db.from('videos').insert([{ title: t, video_url: u }]);
  if(error) alert("Error: " + error.message);
  else {
    alert("Video Saved!");
    document.getElementById("vTitle").value = "";
    document.getElementById("vUrl").value = "";
    loadVideos();
  }
}

async function loadVideos() {
  const { data } = await db.from('videos').select('*').order('created_at', { ascending: false });
  const box = document.getElementById("vList");
  if(!data || data.length === 0) {
    box.innerHTML = "<p>No videos available.</p>";
    return;
  }
  let html = "";
  data.forEach(v => {
    html += `<div style="margin-bottom:15px; background:#0f172a; padding:10px; border-radius:8px;">
      <iframe src="${v.video_url}" style="width:100%; height:200px; border:none; border-radius:8px;"></iframe>
      <h5 style="margin-top:5px; color:#38bdf8;">${v.title}</h5>
    </div>`;
  });
  box.innerHTML = html;
}

function logout() {
  localStorage.removeItem("v_user");
  location.reload();
}
</script>
</body>
  </html>
