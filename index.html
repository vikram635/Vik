
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1c">

  <title>Under Maintenance | Vreditz.in</title>
  <meta name="description" content="Vreditz.in is currently under maintenance. We will be back soon!">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: radial-gradient(circle at top, #172554, #080d1c 65%);
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 45px 25px;
      text-align: center;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #293754;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #60a5fa;
      margin-bottom: 35px;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
      animation: rotate 5s linear infinite;
    }

    h1 {
      font-size: clamp(28px, 6vw, 40px);
      margin-bottom: 18px;
    }

    p {
      font-size: 16px;
      line-height: 1.8;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .status {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      background: #1e293b;
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      background: #3b82f6;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 35px;
      font-size: 13px;
      color: #94a3b8;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon { animation: none; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">VREDITZ.IN</div>

    <div class="icon" aria-hidden="true">⚙️</div>

    <div class="status">● Website Under Maintenance</div>

    <h1>We'll Be Back Soon!</h1>

    <p>
      We are currently performing maintenance on our website
      to bring you a better experience.
      We appreciate your patience and understanding.
      Please check back soon!
    </p>

    <a class="button" href="https://vreditz.in">
      Refresh Website ↻
    </a>

    <footer>
      &copy; <span id="year"></span> Vreditz.in. All rights reserved.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
