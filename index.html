<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIK4NT.INC Attendance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        button, a, input, select { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white pb-20 md:pb-0">

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full px-4 pointer-events-none"></div>

    <!-- AUTH CONTAINER -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
        <div class="w-full max-w-md glass dark:bg-slate-900/80 rounded-3xl p-8 shadow-2xl relative z-10 border border-slate-200 dark:border-slate-800">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600 text-white text-2xl font-black mb-3 shadow-lg shadow-brand-500/30">
                    V4
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight">VIK4NT.INC</h1>
                <p class="text-xs text-brand-600 dark:text-brand-400 font-semibold tracking-wider uppercase mt-1">Attendance Portal</p>
            </div>

            <!-- Login View -->
            <div id="view-login" class="space-y-4">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Welcome back</h2>
                <form id="form-login" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email</label>
                        <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-transparent focus:border-brand-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-transparent focus:border-brand-500 outline-none text-sm">
                    </div>
                    <div class="flex justify-end">
                        <button type="button" onclick="switchAuthView('forgot')" class="text-xs text-brand-600 dark:text-brand-400 font-medium hover:underline">Forgot password?</button>
                    </div>
                    <button type="submit" id="btn-login" class="w-full py-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-lg shadow-brand-500/25 transition">Sign In</button>
                </form>
                <p class="text-xs text-center text-slate-500 mt-6">
                    Don't have an account? <button type="button" onclick="switchAuthView('signup')" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Sign up</button>
                </p>
            </div>

            <!-- Sign Up View -->
            <div id="view-signup" class="space-y-4 hidden">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Create Account</h2>
                <form id="form-signup" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email</label>
                        <input type="email" id="signup-email" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-transparent focus:border-brand-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                        <input type="password" id="signup-password" required minlength="6" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-transparent focus:border-brand-500 outline-none text-sm">
                    </div>
                    <button type="submit" id="btn-signup" class="w-full py-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-lg shadow-brand-500/25 transition mt-2">Register Account</button>
                </form>
                <p class="text-xs text-center text-slate-500">
                    Already registered? <button type="button" onclick="switchAuthView('login')" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Sign in</button>
                </p>
            </div>

            <!-- Forgot Password View -->
            <div id="view-forgot" class="space-y-4 hidden">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Reset Password</h2>
                <form id="form-forgot" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email</label>
                        <input type="email" id="forgot-email" required class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-transparent focus:border-brand-500 outline-none text-sm">
                    </div>
                    <button type="submit" id="btn-forgot" class="w-full py-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-lg transition">Send Reset Link</button>
                </form>
                <p class="text-xs text-center text-slate-500">
                    <button type="button" onclick="switchAuthView('login')" class="text-brand-600 dark:text-brand-400 font-semibold hover:underline">Back to Login</button>
                </p>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-container" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="hidden md:flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-4 shrink-0 justify-between min-h-screen sticky top-0">
            <div>
                <div class="flex items-center gap-3 px-3 py-4 mb-6 border-b border-slate-100 dark:border-slate-800">
                    <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-extrabold shadow-md">V4</div>
                    <div>
                        <h2 class="font-extrabold tracking-tight text-slate-900 dark:text-white text-base leading-tight">VIK4NT.INC</h2>
                        <span class="text-[10px] text-brand-600 dark:text-brand-400 font-bold tracking-widest uppercase">Attendance</span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="navigateTo('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
                    </button>
                    <button onclick="navigateTo('mark')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-fingerprint w-5 text-center"></i> Mark Attendance
                    </button>
                </nav>
            </div>
            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <span id="sidebar-name" class="text-xs font-bold text-slate-900 dark:text-white truncate">User</span>
                <button onclick="handleLogout()" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-xl"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <section id="page-dashboard" class="page-view space-y-6">
                <div class="glass p-6 rounded-3xl bg-gradient-to-r from-brand-600 to-indigo-700 text-white shadow-xl">
                    <h1 class="text-2xl font-extrabold">Welcome, <span id="dash-user-name">User</span> 👋</h1>
                </div>
                <button onclick="navigateTo('mark')" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold text-sm">Mark Attendance Now</button>
            </section>

            <section id="page-mark" class="page-view space-y-6 hidden">
                <h1 class="text-2xl font-extrabold">Mark Attendance</h1>
                <button onclick="executeCheckIn()" class="w-full py-4 rounded-2xl bg-emerald-600 text-white font-bold text-sm">Check In</button>
            </section>
        </main>
    </div>

    <!-- Script Execution -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAHZL3oGytPPhbSm2yiy9LeoEv-G6Fb0i4",
            authDomain: "vikram-media-portal.firebaseapp.com",
            projectId: "vikram-media-portal",
            storageBucket: "vikram-media-portal.firebasestorage.app",
            messagingSenderId: "306957159390",
            appId: "1:306957159390:web:45af46a3507e50119deb4f"
        };

        // Initialize Firebase safely
        try {
            firebase.initializeApp(firebaseConfig);
        } catch(e) {
            console.error(e);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        // Auth state listener
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('dash-user-name').innerText = user.email.split('@')[0];
                document.getElementById('sidebar-name').innerText = user.email.split('@')[0];
                navigateTo('dashboard');
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        function switchAuthView(v) {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-signup').classList.add('hidden');
            document.getElementById('view-forgot').classList.add('hidden');
            document.getElementById(`view-${v}`).classList.remove('hidden');
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await auth.signInWithEmailAndPassword(email, password);
                showToast('Login Successful!', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        document.getElementById('form-signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            try {
                await auth.createUserWithEmailAndPassword(email, password);
                showToast('Account Created Successfully!', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        document.getElementById('form-forgot').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            try {
                await auth.sendPasswordResetEmail(email);
                showToast('Reset email sent!', 'success');
                switchAuthView('login');
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        async function handleLogout() {
            await auth.signOut();
            showToast('Logged out', 'info');
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.add('hidden'));
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
        }

        async function executeCheckIn() {
            showToast('Check In Logged!', 'success');
        }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl text-white text-xs font-bold shadow-lg ${type==='success'?'bg-emerald-600':type==='error'?'bg-rose-600':'bg-slate-800'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
    </script>
</body>
</html>
