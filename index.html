<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIK4NT.INC Attendance System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:Arial, sans-serif; background:#0f172a; color:#fff; min-height:100vh; padding:15px; }
.card{ background:#1e293b; border-radius:16px; padding:25px; width:100%; max-width:420px; margin:20px auto; border:1px solid #334155; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
.app-card{ max-width:800px; }
h2{ text-align:center; color:#38bdf8; margin-bottom:15px; }
.tabs{ display:flex; gap:10px; margin-bottom:15px; }
.tabs button{ flex:1; padding:10px; border:none; border-radius:8px; background:#334155; color:#fff; font-weight:bold; cursor:pointer; }
.tabs button.active{ background:#0284c7; }
input{ width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:15px; }
button.btn-main{ width:100%; padding:12px; margin-top:10px; border:none; border-radius:8px; background:#0284c7; color:#fff; font-weight:bold; font-size:16px; cursor:pointer; }
.msg{ margin-top:12px; padding:10px; border-radius:8px; font-size:14px; text-align:center; font-weight:bold; word-break:break-all; }
.err{ background:#7f1d1d; color:#fca5a5; }
.succ{ background:#14532d; color:#86efac; }
.hidden{ display:none !important; }

/* Dashboard Styles */
.header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #334155; padding-bottom:10px; }
.btn-logout{ background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold; }
.btn-att{ padding:15px; width:100%; margin:10px 0; font-size:18px; border:none; border-radius:10px; cursor:pointer; font-weight:bold; color:#fff; }
.checkin-btn{ background:#10b981; }
.checkout-btn{ background:#f97316; }
table{ width:100%; border-collapse:collapse; margin-top:15px; text-align:left; }
th, td{ padding:10px; border-bottom:1px solid #334155; }
th{ color:#94a3b8; }
</style>
</head>
<body>

<!-- LOGIN / SIGNUP PAGE -->
<div id="authPage" class="card">
  <h2>VIK4NT.INC</h2>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchAuth('login')">Login</button>
    <button id="tabSignup" onclick="switchAuth('signup')">Sign Up</button>
  </div>

  <div id="signupFields" class="hidden">
    <input id="fullName" type="text" placeholder="Full Name">
    <input id="phone" type="tel" placeholder="Phone Number">
  </div>
  <input id="email" type="email" placeholder="Email Address">
  <input id="password" type="password" placeholder="Password (min 6 chars)">

  <button id="btnAuth" class="btn-main" onclick="handleAuth()">Login</button>
  <div id="authMsg" class="msg hidden"></div>
</div>

<!-- MAIN DASHBOARD PAGE -->
<div id="dashPage" class="card app-card hidden">
  <div class="header">
    <h3 id="welcomeText">👋 Welcome</h3>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div style="display:flex; gap:15px; flex-wrap:wrap;">
    <div style="flex:1; min-width:250px;">
      <button class="btn-att checkin-btn" onclick="markAttendance('CHECKED_IN')">🟢 Check In</button>
      <button class="btn-att checkout-btn" onclick="markAttendance('COMPLETED')">🔴 Check Out</button>
    </div>
  </div>

  <h4 style="margin-top:20px; color:#38bdf8;">📋 Attendance History</h4>
  <table>
    <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
    <tbody id="attTable"><tr><td colspan="4" style="text-align:center;">No records found</td></tr></tbody>
  </table>
  <div id="dashMsg" class="msg hidden"></div>
</div>

<script>
const SUPABASE_URL = "https://jdetqupmtgrrwzrufhsg.supabase.co";
const SUPABASE_KEY = "sb_publishable_QVtX3-gxQnXhsZC5tIwV8w_XXOGmmNI";
let db = null;
let mode = "login";
let currentUser = null;

window.onload = function() {
  try {
    if(typeof supabase !== 'undefined'){
      db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const saved = localStorage.getItem("app_current_user");
      if (saved) {
        currentUser = JSON.parse(saved);
        openDashboard();
      }
    } else {
      showMsg("authMsg", "Supabase SDK load nahi hua! Internet check karein.", true);
    }
  } catch(e) {
    showMsg("authMsg", "Error: " + e.message, true);
  }
};

function switchAuth(m) {
  mode = m;
  hideMsg("authMsg");
  if (m === 'signup') {
    document.getElementById("tabSignup").className = "active";
    document.getElementById("tabLogin").className = "";
    document.getElementById("signupFields").className = "";
    document.getElementById("btnAuth").textContent = "Create Account";
  } else {
    document.getElementById("tabLogin").className = "active";
    document.getElementById("tabSignup").className = "";
    document.getElementById("signupFields").className = "hidden";
    document.getElementById("btnAuth").textContent = "Login";
  }
}

function showMsg(id, txt, isErr) {
  const el = document.getElementById(id);
  el.textContent = txt;
  el.className = "msg " + (isErr ? "err" : "succ");
  el.classList.remove("hidden");
}
function hideMsg(id) { document.getElementById(id).className = "msg hidden"; }

async function handleAuth() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMsg("authMsg", "Email aur Password dono bharein!", true);
    return;
  }

  const btn = document.getElementById("btnAuth");
  btn.disabled = true;
  btn.textContent = "Processing...";

  try {
    if (mode === 'signup') {
      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!fullName) {
        showMsg("authMsg", "Apna naam darj karein!", true);
        btn.disabled = false;
        btn.textContent = "Create Account";
        return;
      }

      showMsg("authMsg", "Account ban raha hai...", false);

      const { data, error } = await db.from('users').insert([{
        full_name: fullName,
        email: email,
        phone: phone,
        password: password,
        role: 'USER'
      }]).select();

      btn.disabled = false;
      btn.textContent = "Create Account";

      if (error) {
        showMsg("authMsg", "Signup Fail: " + error.message, true);
      } else {
        showMsg("authMsg", "✅ Account Ban Gaya! Logging in...", false);
        currentUser = (data && data.length > 0) ? data[0] : { full_name: fullName, email: email };
        localStorage.setItem("app_current_user", JSON.stringify(currentUser));
        setTimeout(openDashboard, 800);
      }
    } else {
      showMsg("authMsg", "Logging in...", false);

      const { data, error } = await db.from('users')
        .select('*')
        .eq('email', email)
        .eq('password', password);

      btn.disabled = false;
      btn.textContent = "Login";

      if (error) {
        showMsg("authMsg", "Login Error: " + error.message, true);
      } else if (!data || data.length === 0) {
        showMsg("authMsg", "❌ Galat Email ya Password!", true);
      } else {
        currentUser = data[0];
        localStorage.setItem("app_current_user", JSON.stringify(currentUser));
        openDashboard();
      }
    }
  } catch(err) {
    btn.disabled = false;
    btn.textContent = (mode === 'signup') ? "Create Account" : "Login";
    showMsg("authMsg", "Unexpected Error: " + err.message, true);
  }
}

function openDashboard() {
  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("dashPage").classList.remove("hidden");
  document.getElementById("welcomeText").textContent = "👋 Welcome, " + (currentUser.full_name || "User");
  loadAttendanceRecords();
}

async function markAttendance(st) {
  showMsg("dashMsg", "Processing...", false);
  const today = new Date().toISOString().slice(0,10);
  const time = new Date().toLocaleTimeString();

  try {
    const { error } = await db.from('attendance').insert([{
      user_id: currentUser.user_id || null,
      user_name: currentUser.full_name || "User",
      date: today,
      check_in: st === 'CHECKED_IN' ? time : null,
      check_out: st === 'COMPLETED' ? time : null,
      status: st
    }]);

    if (error) {
      showMsg("dashMsg", "Error: " + error.message, true);
    } else {
      showMsg("dashMsg", "✅ Attendance Marked (" + st + ")", false);
      loadAttendanceRecords();
    }
  } catch(e) {
    showMsg("dashMsg", "Error: " + e.message, true);
  }
}

async function loadAttendanceRecords() {
  if (!currentUser.user_id) return;
  const { data } = await db.from('attendance')
    .select('*')
    .eq('user_id', currentUser.user_id)
    .order('created_at', { ascending: false });

  const tbody = document.getElementById("attTable");
  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records found</td></tr>';
    return;
  }

  let html = "";
  data.forEach(r => {
    html += `<tr><td>${r.date}</td><td>${r.check_in||'--'}</td><td>${r.check_out||'--'}</td><td><b>${r.status}</b></td></tr>`;
  });
  tbody.innerHTML = html;
}

function logout() {
  localStorage.removeItem("app_current_user");
  location.reload();
}
</script>
</body>
</html>
