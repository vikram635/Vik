<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIK4NT.INC Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family: Arial, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; padding: 15px; }
.card{ background: #1e293b; border-radius: 20px; padding: 25px; border: 1px solid #334155; max-width: 400px; margin: 30px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.app-card{ max-width: 900px; }
h2{ text-align: center; color: #38bdf8; margin-bottom: 15px; }
.tabs{ display: flex; gap: 10px; margin-bottom: 15px; }
.tabs button{ flex: 1; padding: 12px; border: none; border-radius: 10px; background: #334155; color: #fff; font-weight: bold; cursor: pointer; }
.tabs button.active{ background: #0284c7; }
input{ width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
button.btn-main{ width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 10px; background: #0284c7; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
.msg{ margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; font-weight: bold; }
.err{ background: #7f1d1d; color: #fca5a5; }
.succ{ background: #14532d; color: #86efac; }
.hidden{ display: none !important; }
.header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
.btn-att{ padding: 15px; width: 100%; margin: 8px 0; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: #fff; }
.checkin{ background: #10b981; }
.checkout{ background: #f97316; }
table{ width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
th, td{ padding: 10px; border-bottom: 1px solid #334155; }
th{ color: #94a3b8; }
</style>
</head>
<body>

<!-- LOGIN / SIGNUP -->
<div id="authPage" class="card">
  <h2>👑 VIK4NT.INC</h2>
  <div class="tabs">
    <button id="tLogin" class="active" onclick="setAuth('login')">Login</button>
    <button id="tSignup" onclick="setAuth('signup')">Sign Up</button>
  </div>

  <div id="sFields" class="hidden">
    <input id="fName" type="text" placeholder="Full Name">
    <input id="fPhone" type="tel" placeholder="Phone Number">
  </div>
  <input id="fEmail" type="email" placeholder="Email Address">
  <input id="fPass" type="password" placeholder="Password">

  <button id="fBtn" class="btn-main" onclick="submitAuth()">Login</button>
  <div id="fMsg" class="msg hidden"></div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="card app-card hidden">
  <div class="header">
    <h3 id="wMsg">👋 Welcome</h3>
    <button onclick="logout()" style="background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">Logout</button>
  </div>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button class="btn-att checkin" onclick="doAtt('CHECKED_IN')">🟢 Check In</button>
    <button class="btn-att checkout" onclick="doAtt('COMPLETED')">🔴 Check Out</button>
  </div>

  <h4 style="margin-top:20px; color:#38bdf8;">📋 Attendance History</h4>
  <table>
    <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
    <tbody id="attRows"><tr><td colspan="4" style="text-align:center;">No records</td></tr></tbody>
  </table>
  <div id="dMsg" class="msg hidden"></div>
</div>

<script>
const S_URL = "https://jdetqupmtgrrwzrufhsg.supabase.co";
const S_KEY = "sb_publishable_QVtX3-gxQnXhsZC5tIwV8w_XXOGmmNI";
let db = null;
let mode = "login";
let user = null;

window.onload = function() {
  try {
    db = supabase.createClient(S_URL, S_KEY);
    const saved = localStorage.getItem("v_user");
    if(saved) {
      user = JSON.parse(saved);
      openDash();
    }
  } catch(e) {
    showBox("fMsg", "Init Error: " + e.message, true);
  }
};

function setAuth(m) {
  mode = m;
  hideBox("fMsg");
  if(m === 'signup') {
    document.getElementById("tSignup").className = "active";
    document.getElementById("tLogin").className = "";
    document.getElementById("sFields").className = "";
    document.getElementById("fBtn").textContent = "Create Account";
  } else {
    document.getElementById("tLogin").className = "active";
    document.getElementById("tSignup").className = "";
    document.getElementById("sFields").className = "hidden";
    document.getElementById("fBtn").textContent = "Login";
  }
}

function showBox(id, txt, err) {
  const el = document.getElementById(id);
  el.textContent = txt;
  el.className = "msg " + (err ? "err" : "succ");
  el.classList.remove("hidden");
}
function hideBox(id) { document.getElementById(id).classList.add("hidden"); }

async function submitAuth() {
  const email = document.getElementById("fEmail").value.trim();
  const pass = document.getElementById("fPass").value;

  if(!email || !pass) {
    showBox("fMsg", "Kripya Email aur Password bharein!", true);
    return;
  }

  showBox("fMsg", "Connecting...", false);

  try {
    if(mode === 'signup') {
      const name = document.getElementById("fName").value.trim();
      const phone = document.getElementById("fPhone").value.trim();
      if(!name) { showBox("fMsg", "Kripya name bharein!", true); return; }

      const { data, error } = await db.from('users').insert([{
        full_name: name, email: email, phone: phone, password: pass, role: 'USER'
      }]).select();

      if(error) {
        showBox("fMsg", "Signup Error: " + error.message, true);
      } else {
        showBox("fMsg", "✅ Account Ban Gaya! Opening...", false);
        user = data[0];
        localStorage.setItem("v_user", JSON.stringify(user));
        setTimeout(openDash, 500);
      }
    } else {
      const { data, error } = await db.from('users').select('*').eq('email', email).eq('password', pass);

      if(error) {
        showBox("fMsg", "Login Error: " + error.message, true);
      } else if(!data || data.length === 0) {
        showBox("fMsg", "❌ Galat Email ya Password!", true);
      } else {
        showBox("fMsg", "✅ Login Successful!", false);
        user = data[0];
        localStorage.setItem("v_user", JSON.stringify(user));
        setTimeout(openDash, 300);
      }
    }
  } catch(err) {
    showBox("fMsg", "Catch Error: " + err.message, true);
  }
}

function openDash() {
  document.getElementById("authPage").className = "card hidden";
  document.getElementById("dashPage").className = "card app-card";
  document.getElementById("wMsg").textContent = "👋 Welcome, " + user.full_name;
  loadAtt();
}

async function doAtt(st) {
  showBox("dMsg", "Saving...", false);
  const today = new Date().toISOString().slice(0,10);
  const time = new Date().toLocaleTimeString();

  const { error } = await db.from('attendance').insert([{
    user_id: user.user_id,
    user_name: user.full_name,
    date: today,
    check_in: st === 'CHECKED_IN' ? time : null,
    check_out: st === 'COMPLETED' ? time : null,
    status: st
  }]);

  if(error) {
    showBox("dMsg", "Error: " + error.message, true);
  } else {
    showBox("dMsg", "✅ Attendance Saved (" + st + ")", false);
    loadAtt();
  }
}

async function loadAtt() {
  const { data } = await db.from('attendance').select('*').eq('user_id', user.user_id).order('created_at', { ascending: false });
  const tbody = document.getElementById("attRows");
  if(!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records</td></tr>';
    return;
  }
  let html = "";
  data.forEach(r => {
    html += `<tr><td>${r.date}</td><td>${r.check_in||'--'}</td><td>${r.check_out||'--'}</td><td><b>${r.status}</b></td></tr>`;
  });
  tbody.innerHTML = html;
}

function logout() {
  localStorage.removeItem("v_user");
  location.reload();
}
</script>
</body>
</html>
